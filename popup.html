<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Showdown Test Bot</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      background-color: #ffffff;
      color: #111111;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
    }
    .warning {
      font-size: 12px;
      color: #333333;
      background: #f5f5f5;
      border-left: 3px solid #111111;
      padding: 10px 12px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 16px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      accent-color: #111111;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background-color: #111111;
      border: 1px solid #111111;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:last-of-type {
      margin-bottom: 0;
    }
    button:hover {
      background-color: #ffffff;
      color: #111111;
    }
    #status {
      font-size: 12px;
      color: #666666;
      margin-top: 12px;
      text-align: center;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <h1>Showdown Test Bot</h1>
  <div class="warning">
    For your own unrated / room-match battles only. Turn off before
    laddering or any ranked play.
  </div>
  <label>
    <input type="checkbox" id="enabledToggle" />
    Auto-play enabled
  </label>
  <button id="exportBtn">Export bug log</button>
  <button id="clearBtn">Clear log</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
